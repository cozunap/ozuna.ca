name = "ozuna-replica-app"
compatibility_date = "2026-10-01"
pages_build_output_dir = "frontend/dist"

# Optional Cloudflare D1 Database Binding for Edge Deployment
[[d1_databases]]
binding = "DB"
database_name = "ozuna-replica-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Optional Cloudflare R2 Bucket for Edge Media Uploads
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "ozuna-media"
